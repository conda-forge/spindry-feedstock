schema_version: 1

context:
  name: spindry
  version: 2026.10.21.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 298f08310ca31474953a7006f6ba9141a2e2d61dde01ce1fbb4411d9eb090dff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - mchammer
    - python >=${{ python_min }}
tests:
  - python:
      imports:
        - spindry
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Contains MC algorithm for generating host-guest conformers.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/andrewtarzia/SpinDry

extra:
  recipe-maintainers:
    - jan-janssen
